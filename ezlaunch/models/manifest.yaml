# Verified against Hugging Face (Comfy-Org/MiniMax-H3 + larryvrh/MiniMax-H3-Turbo-Lora)
# on 2026-08-11. `hf_path` is the path inside the HF repo; `dest` is under ComfyUI/.
# Workflows ship from ezlaunch/workflows/ (t2v + i2v + ref2v turbo).
min_disk_gb: 100

custom_nodes:
  - name: ComfyUI_MiniMax_H3_Turbo
    git: "https://github.com/Larryvrh/ComfyUI-MiniMax-H3-Turbo.git"
    dest: "custom_nodes/ComfyUI_MiniMax_H3_Turbo"

files:
  - id: unet_fl2va_int8
    repo: "Comfy-Org/MiniMax-H3"
    hf_path: "diffusion_models/minimax_h3_fl2va_pruned_int8_convrot.safetensors"
    dest: "models/diffusion_models/minimax_h3_fl2va_pruned_int8_convrot.safetensors"
    approx_gb: 20
    required: true
    note: "FL2VA pruned int8 — used by t2v and i2v turbo workflows"

  - id: unet_ref2va_int8
    repo: "Comfy-Org/MiniMax-H3"
    hf_path: "diffusion_models/minimax_h3_ref2va_pruned_int8_convrot.safetensors"
    dest: "models/diffusion_models/minimax_h3_ref2va_pruned_int8_convrot.safetensors"
    approx_gb: 20
    required: true
    note: "REF2VA pruned int8 — used by ref2v turbo workflow (separate base from FL2VA)"

  - id: lora_turbo_v4
    repo: "larryvrh/MiniMax-H3-Turbo-Lora"
    hf_path: "minimax_h3_turbo_v4_step600_ema.safetensors"
    dest: "models/loras/minimax_h3_turbo_v4_step600_ema.safetensors"
    approx_gb: 0.8
    required: true
    note: "Turbo LoRA v4 EMA (recommended for most 4–8 step work)"

  - id: vae_video
    repo: "Comfy-Org/MiniMax-H3"
    hf_path: "vae/minimax_h3_video_vae_fp16.safetensors"
    dest: "models/vae/minimax_h3_video_vae_fp16.safetensors"
    approx_gb: 5
    required: true

  - id: vae_audio
    repo: "Comfy-Org/MiniMax-H3"
    hf_path: "vae/minimax_h3_audio_vae_fp32.safetensors"
    dest: "models/vae/minimax_h3_audio_vae_fp32.safetensors"
    approx_gb: 0.6
    required: true

  - id: text_encoder
    repo: "Comfy-Org/MiniMax-H3"
    hf_path: "text_encoders/qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors"
    dest: "models/text_encoders/qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors"
    approx_gb: 15
    required: true
    note: "Large TE — runtime profile keeps CLIP on CPU"

  # Optional: community "Heretic" (abliterated/uncensored) text encoder.
  # Only downloaded when te_variant is set to "heretic" in state.json.
  # Filename matches stock so ComfyUI CLIPLoader picks it up automatically.
  # Source: https://huggingface.co/sakamakismile/Qwen3-VL-32B-Heretic-MiniMax-H3-NVFP4
  # Size: ~15 GB. Not guaranteed to bypass all safety filters — user responsibility.
  - id: text_encoder_heretic
    repo: "sakamakismile/Qwen3-VL-32B-Heretic-MiniMax-H3-NVFP4"
    hf_path: "qwen3vl_32b_heretic_minimax_h3_nvfp4.safetensors"
    dest: "models/text_encoders/qwen3vl_32b_heretic_minimax_h3_nvfp4.safetensors"
    approx_gb: 15
    required: false
    note: "Heretic/abliterated TE — optional, ~15 GB extra. Select in wizard."

# Legacy single-workflow key kept for older code paths; install prefers workflows/
workflow:
  source_in_node: "example_workflows/minimax_h3_t2v_turbo.json"
  dest: "user/default/workflows/minimax_h3_t2v_turbo.json"
