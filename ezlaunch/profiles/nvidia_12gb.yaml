# 10–12GB NVIDIA: 3060 12GB, 3080 10GB, 4070 12GB, 5070 12GB
id: nvidia_12gb
display_name: "NVIDIA 12GB class"
tier: "12gb"
vram_gb_min: 10
ram_gb_min: 32
ram_gb_comfort: 64
driver_min: "535.0"
driver_recommended: "550.0"
torch_index_url: "https://download.pytorch.org/whl/cu128"
torch_packages:
  - "torch"
  - "torchvision"
  - "torchaudio"
comfy_env:
  COMFY_KITCHEN_FORCE_CUDA: "1"
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
comfy_args:
  - "--listen"
  - "127.0.0.1"
  - "--port"
  - "8188"
  - "--disable-pinned-memory"
  - "--fp16-intermediates"
  - "--disable-cuda-malloc"
  - "--disable-smart-memory"
  - "--use-sage-attention"
attention_fallback_args:
  - "--use-pytorch-cross-attention"
sage_sm89_triton_patch: false
clip_device: cpu
default_megapixels: 0.4
default_steps: 8
notes: >
  Binding constraint is system RAM + PCIe offload, not the 12GB itself.
  Transformer is ~19.5 GiB — part streams every step. 32GB RAM required,
  64GB is the real comfort fix. Default 480p-class + Turbo 8-step.
  Do not stack --lowvram with --disable-pinned-memory.

  Community timings (Hamster 2026-08-24, n=1 each unless noted):
  - 3080 10GB + 32GB: 5s @ ~1.2MP (1216x672) ~15 min — settings unknown,
    "it finishes" note only, not a default recipe. SLA-node step-time path exists.
  - 5070 12GB: 10s @ 864x480 ~15 min (n=1); 6s @ 1.0MP (1376x768) ~35 min
    on FP8 quant (n=1). Our INT8 pack expected faster. 64GB RAM in both runs.
  - 4070/4070 Super 12GB + 32-64GB: 5s @ 0.4-0.9MP in 3-7 min range with
    Turbo + EasyCache (guide + community). 15s scales to 15-25+ min.
    64GB RAM recommended for comfort.
