# Workstation 48GB+ NVIDIA: RTX 6000 Ada, PRO 5000 48GB, A6000
id: nvidia_48gb
display_name: "NVIDIA 48GB+ workstation"
tier: "48gb"
vram_gb_min: 40
ram_gb_min: 64
ram_gb_comfort: 128
driver_min: "550.0"
driver_recommended: "570.0"
torch_index_url: "https://download.pytorch.org/whl/cu128"
torch_packages:
  - "torch"
  - "torchvision"
  - "torchaudio"
comfy_env:
  COMFY_KITCHEN_FORCE_CUDA: "1"
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
comfy_args:
  - "--listen"
  - "127.0.0.1"
  - "--port"
  - "8188"
  - "--disable-pinned-memory"
  - "--fp16-intermediates"
  - "--disable-cuda-malloc"
  - "--use-sage-attention"
attention_fallback_args:
  - "--use-pytorch-cross-attention"
sage_sm89_triton_patch: false
clip_device: cpu
default_megapixels: 1.0
default_steps: 8
notes: >
  Workstation NVIDIA. Same pruned INT8 pack. More VRAM = less offload, not a
  different model. 128GB host RAM is comfort, not a hard requirement.
