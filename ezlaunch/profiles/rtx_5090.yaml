# Blackwell 32GB (RTX 5090)
id: rtx_5090
display_name: "NVIDIA GeForce RTX 5090"
tier: "32gb"
match_names:
  - "RTX 5090"
  - "GeForce RTX 5090"
compute_capability: [10, 0]
vram_gb_min: 28
ram_gb_min: 64
ram_gb_comfort: 128
driver_min: "570.0"
driver_recommended: "580.0"
torch_index_url: "https://download.pytorch.org/whl/cu128"
torch_packages:
  - "torch"
  - "torchvision"
  - "torchaudio"
comfy_env:
  COMFY_KITCHEN_FORCE_CUDA: "1"
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
comfy_args:
  - "--listen"
  - "127.0.0.1"
  - "--port"
  - "8188"
  - "--disable-pinned-memory"
  - "--fp16-intermediates"
  - "--disable-cuda-malloc"
  - "--disable-smart-memory"
  - "--use-sage-attention"
attention_fallback_args:
  - "--use-pytorch-cross-attention"
sage_sm89_triton_patch: false
clip_device: cpu
default_megapixels: 0.7
default_steps: 8
notes: >
  32GB Blackwell. Same Comfy-Org pruned INT8 pack as 24GB for this branch
  (NVFP4 pack is a later add). Peak VRAM on some 5090 suites is ~31.8GB —
  32GB is headroom, not luxury. RAM floor 64GB, 128GB comfort.
