# Battle-tested stack (RTX 4090 / Ada sm_89)
id: rtx_4090
display_name: "NVIDIA GeForce RTX 4090"
match_names:
  - "RTX 4090"
  - "GeForce RTX 4090"
compute_capability: [8, 9]
vram_gb_min: 20
driver_min: "570.0"
driver_recommended: "580.0"
torch_index_url: "https://download.pytorch.org/whl/cu128"
torch_packages:
  - "torch"
  - "torchvision"
  - "torchaudio"
comfy_env:
  COMFY_KITCHEN_FORCE_CUDA: "1"
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
comfy_args:
  - "--listen"
  - "127.0.0.1"
  - "--port"
  - "8188"
  - "--disable-pinned-memory"
  - "--fp16-intermediates"
  - "--disable-cuda-malloc"
  - "--lowvram"
  - "--disable-async-offload"
  - "--disable-smart-memory"
  - "--use-sage-attention"
attention_fallback_args:
  - "--use-pytorch-cross-attention"
sage_sm89_triton_patch: true
clip_device: cpu
default_megapixels: 0.7
default_steps: 4
notes: >
  Use kitchen CUDA int8/ConvRot + Sage v2. If Sage CUDA FP8 kernels
  launch-fail on Ada, apply sm89→Triton patch. CLIP/TE stays on CPU.
