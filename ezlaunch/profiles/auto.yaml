# Name substrings → profile id (first match wins, case-insensitive).
# More specific names must come first (5070 Ti before 5070, 4060 Ti before 4060).
# After a name hit, detect.py demotes if measured VRAM is below the profile floor
# (e.g. 4060 Ti 8GB must not stay on the 16GB profile).
mappings:
  - contains: "5090"
    profile: rtx_5090
  - contains: "4090"
    profile: rtx_4090
  - contains: "3090"
    profile: rtx_3090
  - contains: "3080"
    profile: nvidia_12gb
  - contains: "3070"
    profile: nvidia_8gb
  - contains: "3060"
    profile: nvidia_12gb
  - contains: "5080"
    profile: nvidia_16gb
  - contains: "5070 Ti"
    profile: nvidia_16gb
  - contains: "5070"
    profile: nvidia_12gb
  - contains: "5060 Ti"
    profile: nvidia_16gb
  - contains: "5060"
    profile: nvidia_8gb
  - contains: "4080"
    profile: nvidia_16gb
  - contains: "4070 Ti Super"
    profile: nvidia_16gb
  - contains: "4070 Ti"
    profile: nvidia_12gb
  - contains: "4070 Super"
    profile: nvidia_12gb
  - contains: "4070"
    profile: nvidia_12gb
  - contains: "4060 Ti"
    profile: nvidia_16gb
  - contains: "4060"
    profile: nvidia_8gb
  - contains: "4050"
    profile: nvidia_8gb
  - contains: "3050"
    profile: nvidia_8gb
  - contains: "2080 Ti"
    profile: nvidia_12gb
  - contains: "2080"
    profile: nvidia_8gb
  - contains: "2070"
    profile: nvidia_8gb
  - contains: "2060"
    profile: nvidia_8gb
  - contains: "A6000"
    profile: nvidia_48gb
  - contains: "RTX 6000"
    profile: nvidia_48gb
  - contains: "RTX PRO 6000"
    profile: nvidia_48gb
  - contains: "RTX 5000"
    profile: nvidia_48gb
  - contains: "A5000"
    profile: nvidia_16gb
  - contains: "TITAN RTX"
    profile: rtx_3090

# Measured VRAM → profile when the name is unknown or the name-hit is too fat.
# First row whose min_mib <= vram_mib wins (keep descending).
vram_fallback:
  - min_mib: 40000
    profile: nvidia_48gb
  - min_mib: 28000
    profile: rtx_5090
  - min_mib: 20000
    profile: rtx_3090
  - min_mib: 14000
    profile: nvidia_16gb
  - min_mib: 9500
    profile: nvidia_12gb
  - min_mib: 7000
    profile: nvidia_8gb

fallback_unknown_24gb: rtx_3090
unsupported_message: >
  This build supports NVIDIA GeForce / RTX cards from ~8GB up.
  AMD, Intel, and Apple Silicon are not in this branch yet.
  Pascal GTX 10-series is accepted but expected to be ~10x slower (no INT8 path).
