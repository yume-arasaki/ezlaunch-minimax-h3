[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ezlaunch-minimax-h3"
version = "0.1.0"
description = "Double-click installer to run MiniMax-H3 Turbo video on RTX 4090 / 3090"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "EZlaunch contributors" }]
dependencies = [
  "pyyaml>=6.0",
  "huggingface_hub>=0.23.0",
  "requests>=2.28.0",
]

[project.optional-dependencies]
gui = []
dev = ["pytest>=7.0"]

[project.scripts]
ezlaunch = "ezlaunch.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ezlaunch*"]

[tool.setuptools.package-data]
ezlaunch = ["profiles/*.yaml", "models/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
